name: Build HisabYar Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    name: Build local-only Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Find and extract v1.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HisabYar_Offline_v1.0.0.zip"
          test -s "$GITHUB_WORKSPACE/$ZIP_FILE" || { echo "::error::Missing $ZIP_FILE in repository root"; find . -maxdepth 3 -iname '*.zip' -print; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "::error::Gradle settings file not found"; exit 1; }
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
      - name: Verify offline-only app and source version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          grep -q "versionName '1.0.0'" app/build.gradle
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then echo "::error::App must not request internet permission"; exit 1; fi
          grep -q 'خلاصه ۳۰ روز اخیر' app/src/main/java/com/example/hisabyar/MainActivity.java
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Offline-v1.0.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
