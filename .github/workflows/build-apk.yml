name: Build HisabYar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Extract source ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HisabYar_Completed_Source_v0.2.0.zip"
          if [ ! -s "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "::error::فایل $ZIP_FILE در ریشه مخزن پیدا نشد. فایل ZIP سورس را کنار README بارگذاری کن."
            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/extracted_source"
          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted_source"
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted_source" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle داخل ZIP پیدا نشد."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate source files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s settings.gradle
          test -s build.gradle
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q "versionName '0.2.0'" app/build.gradle
          grep -q 'showDebts' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'showBudgets' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'exportBackup' app/src/main/java/com/example/hisabyar/MainActivity.java

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-debug-APK-v0.2.0
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
