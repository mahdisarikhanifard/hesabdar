name: Build HisabYar Pro Offline v1.6.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare exact version 1.6.1 source
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the exact v1.6.1 source ZIP. Never select an older ZIP by wildcard.
          ZIP_FILE="./HisabYar_Pro_Offline_v1.6.1_Source.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE. Upload the complete v1.6.1 source ZIP to the repository root, or upload the extracted project files."
            echo "ZIP files found in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi
          rm -rf /tmp/hisabyar-source
          mkdir -p /tmp/hisabyar-source
          unzip -q "$ZIP_FILE" -d /tmp/hisabyar-source
          mapfile -t GRADLE_FILES < <(find /tmp/hisabyar-source -type f -path '*/app/build.gradle' -print)
          if [[ "${#GRADLE_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one app/build.gradle in the source ZIP. Found: ${#GRADLE_FILES[@]}"
            printf '%s\n' "${GRADLE_FILES[@]}"
            exit 1
          fi
          GRADLE_FILE="${GRADLE_FILES[0]}"
          PROJECT_ROOT="${GRADLE_FILE%/app/build.gradle}"
          echo "Detected project root: $PROJECT_ROOT"
          grep -n 'versionName' "$GRADLE_FILE"
          grep -q "versionName '1.6.1-Pro'" "$GRADLE_FILE"
          grep -q "cz.adaptech.tesseract4android:tesseract4android:4.9.0" "$GRADLE_FILE"
          test -s "$PROJECT_ROOT/settings.gradle"
          test -s "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          test -s "$PROJECT_ROOT/app/src/main/java/com/example/hisabyar/MainActivity.java"
          # Copy project files into the checked-out repository root, preserving the workflow just checked out.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$PROJECT_ROOT"/. .
          echo "Project version: $(grep 'versionName' app/build.gradle)"
          echo 'Project source prepared successfully.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Download and bundle Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip' \
            -o /tmp/vosk-fa.zip
          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa
          MODEL_DIR="$(find /tmp/vosk-fa -type f -path '*/am/final.mdl' -print -quit | sed 's#/am/final.mdl$##')"
          if [[ -z "$MODEL_DIR" ]]; then
            echo '::error::فایل اصلی مدل Vosk یعنی am/final.mdl در ZIP پیدا نشد.'
            find /tmp/vosk-fa -maxdepth 3 -type f | head -80
            exit 1
          fi
          # Some official model archives omit metadata files expected by
          # Vosk Android StorageService. Supply them when absent.
          mkdir -p "$MODEL_DIR/conf"
          if [[ ! -s "$MODEL_DIR/conf/model.conf" ]]; then
            cat > "$MODEL_DIR/conf/model.conf" <<'EOF'
          --beam=13.0
          --lattice-beam=6.0
          EOF
          fi
          if [[ ! -s "$MODEL_DIR/uuid" ]]; then
            printf '%s\n' 'hisabyar-vosk-fa-0.42-v1.6.0' > "$MODEL_DIR/uuid"
          fi
          test -s "$MODEL_DIR/am/final.mdl"
          test -s "$MODEL_DIR/conf/model.conf"
          test -s "$MODEL_DIR/uuid"
          rm -rf app/src/main/assets/model-fa
          cp -a "$MODEL_DIR" app/src/main/assets/model-fa
          test -s app/src/main/assets/model-fa/am/final.mdl
          test -s app/src/main/assets/model-fa/uuid
          test -s app/src/main/assets/model-fa/conf/model.conf
          echo "Vosk Persian model bundled: $(du -sh app/src/main/assets/model-fa | cut -f1)"

      - name: Download and bundle Persian and English OCR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/fas.traineddata' \
            -o app/src/main/assets/tessdata/fas.traineddata
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/eng.traineddata' \
            -o app/src/main/assets/tessdata/eng.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/fas.traineddata)" -gt 100000
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -gt 100000
          echo 'OCR models bundled:'
          du -h app/src/main/assets/tessdata/*.traineddata

      - name: Validate source, model files, and offline policy (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          check_file() {
            if [[ ! -s "$1" ]]; then
              echo "::error::Required file is missing or empty: $1"
              echo 'Nearby files:'
              find "$(dirname "$1")" -maxdepth 2 -type f -printf '%p (%s bytes)\n' 2>/dev/null | head -80 || true
              exit 1
            fi
            echo "OK file: $1 ($(stat -c%s "$1") bytes)"
          }
          check_text() {
            if ! grep -Fq -- "$2" "$1"; then
              echo "::error::Required text not found in $1: $2"
              exit 1
            fi
            echo "OK text in $1: $2"
          }
          check_text app/build.gradle "versionName '1.6.1-Pro'"
          check_text app/build.gradle "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
          check_text app/src/main/java/com/example/hisabyar/MainActivity.java 'TessBaseAPI'
          check_text app/src/main/java/com/example/hisabyar/MainActivity.java 'OEM_LSTM_ONLY'
          check_text settings.gradle 'jitpack.io'
          check_text app/src/main/java/com/example/hisabyar/MainActivity.java 'tessdata/fas.traineddata'
          check_text app/src/main/java/com/example/hisabyar/MainActivity.java 'tessdata/eng.traineddata'
          check_file app/src/main/assets/model-fa/uuid
          check_file app/src/main/assets/model-fa/conf/model.conf
          check_file app/src/main/assets/model-fa/am/final.mdl
          check_file app/src/main/assets/tessdata/fas.traineddata
          check_file app/src/main/assets/tessdata/eng.traineddata
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo '::error::App must not request Internet permission.'
            exit 1
          fi
          echo 'OK: offline manifest policy'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify models are embedded in APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/model-fa/uuid'
          unzip -l "$APK" | grep -F 'assets/model-fa/conf/model.conf'
          unzip -l "$APK" | grep -F 'assets/tessdata/fas.traineddata'
          unzip -l "$APK" | grep -F 'assets/tessdata/eng.traineddata'
          unzip -p "$APK" assets/tessdata/fas.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'
          unzip -p "$APK" assets/tessdata/eng.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.6.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
