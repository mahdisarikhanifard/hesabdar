name: Build HisabYar Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify local-only Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract HisabYar source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HisabYar_Offline_v1.1.0.zip"
          if [ ! -s "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "::error::فایل $ZIP_FILE در ریشه مخزن پیدا نشد."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$GITHUB_WORKSPACE/$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"
          SETTINGS="$(find "$GITHUB_WORKSPACE/source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::فایل تنظیمات Gradle داخل ZIP پیدا نشد."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate app source and offline policy
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          grep -q "versionName '1.1.0'" app/build.gradle
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "::error::این برنامه باید کاملاً آفلاین بماند."
            exit 1
          fi
          grep -q 'recurring' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'current_amount' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'transfer_id' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'PRAGMA integrity_check' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'exportTransactionsCsv' app/src/main/java/com/example/hisabyar/MainActivity.java

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Offline-v1.1.0-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
