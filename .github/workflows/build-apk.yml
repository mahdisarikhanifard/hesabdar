name: Build HisabYar Pro Offline v1.9.1 SmartBankCapture Fixed2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'HisabYar_Pro_Offline_v1.9.1_SmartBankCapture_Fixed2.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate exact v1.9.1 Fixed2 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HisabYar_Pro_Offline_v1.9.1_SmartBankCapture_Fixed2.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Required source ZIP is missing: $ZIP_FILE"
            echo "Place the Fixed2 ZIP in the repository root."
            exit 1
          fi

          rm -rf /tmp/hesabyar-source
          mkdir -p /tmp/hesabyar-source
          unzip -q "$ZIP_FILE" -d /tmp/hesabyar-source

          PROJECT_ROOT="$(find /tmp/hesabyar-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::The ZIP does not contain app/build.gradle."
            exit 1
          fi

          for required in \
            build.gradle \
            settings.gradle \
            gradle.properties \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/example/hisabyar/MainActivity.java \
            app/src/main/java/com/example/hisabyar/BankSmsReceiver.java \
            app/src/main/java/com/example/hisabyar/BankNotificationListener.java; do
            if [[ ! -s "$PROJECT_ROOT/$required" ]]; then
              echo "::error::Required source file is missing or empty: $required"
              exit 1
            fi
          done

          # Build only the exact project extracted from Fixed2, not stale repository files.
          rm -rf app build.gradle settings.gradle gradle.properties
          cp -a "$PROJECT_ROOT"/. .

          grep -qE 'versionCode[[:space:]]+191([[:space:]]|$)' app/build.gradle
          grep -qF "versionName '1.9.1-Pro-SmartBankCapture'" app/build.gradle
          grep -qF "applicationId 'com.example.hisabyarpro'" app/build.gradle
          grep -qF "namespace 'com.example.hisabyar'" app/build.gradle

          # Confirm the Java Parcelable-array fix is present in the selected source.
          grep -qF 'android.os.Parcelable[] messages = e.getParcelableArray(Notification.EXTRA_MESSAGES);' \
            app/src/main/java/com/example/hisabyar/BankNotificationListener.java
          grep -qF 'for (android.os.Parcelable item : messages)' \
            app/src/main/java/com/example/hisabyar/BankNotificationListener.java

          echo "Validated source: $ZIP_FILE"
          echo "Project root in ZIP: $PROJECT_ROOT"
          echo "Package namespace: com.example.hisabyar"
          echo "Application ID: com.example.hisabyarpro"
          echo "Version: 1.9.1-Pro-SmartBankCapture (191)"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download and bundle Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip' \
            -o /tmp/vosk-fa.zip
          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa

          MODEL_DIR="$(find /tmp/vosk-fa -type f -path '*/am/final.mdl' -print -quit | sed 's#/am/final.mdl$##')"
          if [[ -z "$MODEL_DIR" ]]; then
            echo "::error::Persian Vosk model archive did not contain am/final.mdl."
            exit 1
          fi

          mkdir -p "$MODEL_DIR/conf"
          if [[ ! -s "$MODEL_DIR/conf/model.conf" ]]; then
            printf '%s\n' '--beam=13.0' '--lattice-beam=6.0' > "$MODEL_DIR/conf/model.conf"
          fi
          if [[ ! -s "$MODEL_DIR/uuid" ]]; then
            printf '%s\n' 'hesabyar-vosk-fa-0.42-v1.9.1' > "$MODEL_DIR/uuid"
          fi

          rm -rf app/src/main/assets/model-fa
          cp -a "$MODEL_DIR" app/src/main/assets/model-fa
          test -s app/src/main/assets/model-fa/am/final.mdl
          echo "Persian offline speech model bundled into APK assets."

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build completed without producing the expected APK."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.9.1-SmartBankCapture-Fixed2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
