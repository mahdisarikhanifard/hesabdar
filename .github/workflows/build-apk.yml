name: Build HesabYar APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 4 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE=$(find "$ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "The ZIP may not contain a complete Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon

          elif [ -f gradlew.bat ]; then
            echo "ERROR: Only the Windows Gradle wrapper was found."
            echo "A Linux Gradle wrapper is required for this workflow."
            exit 1

          else
            echo "Gradle wrapper not found."

            if command -v gradle >/dev/null 2>&1; then
              gradle assembleDebug --no-daemon
            else
              echo "ERROR: Gradle is not installed and gradlew is missing."
              exit 1
            fi
          fi

      - name: Find APK files
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" -type f -name "*.apk" \
            -print

          if ! find "$PROJECT_DIR" -type f -name "*.apk" \
            -print -quit | grep -q .; then
            echo "ERROR: No APK file was generated."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesabdar-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
