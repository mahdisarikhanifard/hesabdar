name: Build hesabyar APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Find and extract source ZIP
        run: |
          ZIP_FILE=$(find . -type f \
            -iname "hesabyar_Pro_Offline_v1.9.3_GitHubReady.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found."
            echo "Expected: hesabyar_Pro_Offline_v1.9.3_GitHubReady.zip"
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify project files
        run: |
          echo "Checking Android project..."

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -d "$PROJECT_DIR/app/src/main"

          echo "Project files found."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output
          cp "$APK_FILE" \
            "output/hesabyar-Pro-Offline-v1.9.3.apk"

          echo "APK copied to output folder."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-Pro-Offline-v1.9.3-APK
          path: output/hesabyar-Pro-Offline-v1.9.3.apk
          if-no-files-found: error
          retention-days: 14
