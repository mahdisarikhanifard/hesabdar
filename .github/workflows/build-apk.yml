name: Build HisabYar Pro Offline v1.8.8

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '*.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Always use the ZIP source first. Do not build stale app/ files already in the repo.
      - name: Extract v1.8.8 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./HisabYar_Pro_Offline_v1.8.8_BankParsing_AccountEdit.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*v1.8.8*BackupList*ChequeTotalsSearchFix*.zip' -print -quit || true)"
          fi
          if [[ -z "${ZIP_FILE:-}" || ! -s "$ZIP_FILE" ]]; then
            echo "::error::Missing v1.8.8 source ZIP in repository root."
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort || true
            exit 1
          fi
          rm -rf /tmp/hesabyar-source
          mkdir -p /tmp/hesabyar-source
          unzip -q "$ZIP_FILE" -d /tmp/hesabyar-source
          PROJECT_ROOT="$(find /tmp/hesabyar-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::ZIP does not contain app/build.gradle."
            exit 1
          fi
          # Replace stale repository project files with the exact source from the ZIP.
          cp -a "$PROJECT_ROOT"/. .
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java
          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          echo "Source extracted from: $ZIP_FILE"
          echo "normalizeBankText definitions in selected MainActivity:"
          grep -nE 'private[[:space:]]+String[[:space:]]+normalizeBankText[[:space:]]*\(' app/src/main/java/com/example/hisabyar/MainActivity.java
          COUNT="$(grep -Ec 'private[[:space:]]+String[[:space:]]+normalizeBankText[[:space:]]*\(' app/src/main/java/com/example/hisabyar/MainActivity.java || true)"
          if [[ "$COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one normalizeBankText method, found $COUNT."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify app version
        shell: bash
        run: |
          set -euo pipefail
          grep -qE 'versionCode[[:space:]]+188([[:space:]]|$)' app/build.gradle
          grep -qF "versionName '1.8.8-Pro'" app/build.gradle
          grep -qF 'private void importBackup()' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'Snapshot before listing failed' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'انتخاب فایل دستی' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'collectAutomaticBackupFiles' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'تعداد چک‌های منطبق' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'HisabYar_auto_' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'PRAGMA integrity_check' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'private void editAccountDialog(String oldName)' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'ساعت استخراج‌شده:' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'confirm_bank_messages_on_start' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'reviewNextBankCandidate' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -qF 'isLikelyBankMessage' app/src/main/java/com/example/hisabyar/BankSmsReceiver.java
          grep -qF 'isLikelyBankTransaction' app/src/main/java/com/example/hisabyar/BankNotificationListener.java
          echo "Version 1.8.8-Pro (188) verified."
          grep -qF "com.tom-roush:pdfbox-android:2.0.27.0" app/build.gradle
          grep -q 'readXlsxRows' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'readTextFromPdf' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'importStatementBytes' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'purgeOldPendingStatementRows' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'normalizeStatementDate' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'Excel day serials' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'شرح تراکنش را خودت وارد کن' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'تراکنش قبل از تاریخ معرفی بانک در نرم‌افزار است و اجازه ثبت ندارد' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'تاریخ نامشخص: ' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'private void enforcePendingStatementCutoff' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'blocked_cutoff' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'No defensible cutoff' app/src/main/java/com/example/hisabyar/MainActivity.java || grep -q 'هرگز از قدیمی‌ترین تراکنش' app/src/main/java/com/example/hisabyar/MainActivity.java || grep -q 'Never infer the cutoff from an old transaction' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'ابتدا نوع تراکنش را انتخاب کن' app/src/main/java/com/example/hisabyar/MainActivity.java
          echo "Excel/PDF import hooks and user-controlled bank registration form verified."

      - name: Download and bundle Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip' \
            -o /tmp/vosk-fa.zip
          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa
          MODEL_DIR="$(find /tmp/vosk-fa -type f -path '*/am/final.mdl' -print -quit | sed 's#/am/final.mdl$##')"
          if [[ -z "$MODEL_DIR" ]]; then
            echo "::error::Persian Vosk model not found in downloaded archive."
            exit 1
          fi
          mkdir -p "$MODEL_DIR/conf"
          if [[ ! -s "$MODEL_DIR/conf/model.conf" ]]; then
            printf '%s\n' '--beam=13.0' '--lattice-beam=6.0' > "$MODEL_DIR/conf/model.conf"
          fi
          if [[ ! -s "$MODEL_DIR/uuid" ]]; then
            printf '%s\n' 'hesabyar-vosk-fa-0.42-v1.8.8' > "$MODEL_DIR/uuid"
          fi
          rm -rf app/src/main/assets/model-fa
          cp -a "$MODEL_DIR" app/src/main/assets/model-fa
          test -s app/src/main/assets/model-fa/am/final.mdl
          echo "Persian offline speech model bundled."

      - name: Build APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.8.8-BackupList-ChequeTotalsSearchFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
