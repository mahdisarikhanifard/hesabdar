      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./HisabYar_Pro_Offline_v1.6.0_Voice_OCR_Fixed.zip"

          echo "Checking exact project ZIP..."

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Version 1.6.0 ZIP not found."
            find . -maxdepth 2 -type f -iname '*1.6.0*.zip' -print || true
            exit 1
          fi

          echo "Using exact ZIP: $ZIP_FILE"

          rm -rf /tmp/hisabyar-source
          mkdir -p /tmp/hisabyar-source

          unzip -q "$ZIP_FILE" -d /tmp/hisabyar-source

          PROJECT_ROOT="$(
            find /tmp/hisabyar-source \
              -type f \
              -path '*/app/build.gradle' \
              -print -quit |
              sed 's#/app/build.gradle$##'
          )"

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "::error::app/build.gradle not found inside ZIP."
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"

          grep -n 'versionName' "$PROJECT_ROOT/app/build.gradle"

          if ! grep -q "versionName '1.6.0-Pro'" \
            "$PROJECT_ROOT/app/build.gradle"; then
            echo "::error::The selected ZIP is not version 1.6.0-Pro."
            exit 1
          fi

          if ! grep -q "com.rmtheis:tess-two:9.1.0" \
            "$PROJECT_ROOT/app/build.gradle"; then
            echo "::error::Tesseract dependency is missing."
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. .

          echo "Extracted project version:"
          grep -n 'versionName' app/build.gradle

          grep -q "versionName '1.6.0-Pro'" app/build.gradle

          echo "Correct project source prepared."
