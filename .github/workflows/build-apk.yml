
name: Build hesabyar Pro Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Android project structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository root
        run: |
          echo "Repository root:"
          pwd
          echo ""
          echo "Root directory contents:"
          ls -la

      - name: Find Android Gradle project files
        run: |
          echo "Searching for Android Gradle project files..."

          find . -maxdepth 8 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" -o \
            -name "AndroidManifest.xml" \
          \) -print

      - name: Find ZIP source archives
        run: |
          echo "Searching for ZIP files..."

          find . -maxdepth 5 -type f -iname "*.zip" -print

      - name: Check project root candidates
        run: |
          echo "Checking common Android project locations..."

          for dir in \
            "." \
            "./app" \
            "./source" \
            "./hesabyar" \
            "./hesabyar_Pro_Offline" \
            "./source/hesabyar" \
            "./source/hesabyar_Pro_Offline"
          do
            if [ -d "$dir" ]; then
              echo ""
              echo "Directory: $dir"
              ls -la "$dir"
            fi
          done
