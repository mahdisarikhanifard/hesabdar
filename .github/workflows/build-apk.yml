name: Build HisabYar Pro Offline v1.5.9

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download and bundle official Persian OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/fas.traineddata" \
            -o app/src/main/assets/tessdata/fas.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/fas.traineddata)" -gt 100000
          echo "Persian OCR model size: $(du -h app/src/main/assets/tessdata/fas.traineddata | cut -f1)"
      - name: Validate source and offline OCR
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '1.5.9-Pro'" app/build.gradle
          grep -q "com.rmtheis:tess-two:9.1.0" app/build.gradle
          grep -q 'TessBaseAPI' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'fas.traineddata' app/src/main/java/com/example/hisabyar/MainActivity.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'App must not request Internet permission.'; exit 1
          fi
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK and bundled OCR model
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/tessdata/fas.traineddata'
          unzip -p "$APK" assets/tessdata/fas.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.5.9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
