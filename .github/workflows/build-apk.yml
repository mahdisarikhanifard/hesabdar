name: Build HisabYar Pro Offline v1.5.9

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository may contain only the project ZIP plus this workflow.
      # Extract the project ZIP into the repository root before validating/building.
      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f app/build.gradle ]]; then
            ZIP_FILE=""
            for candidate in \
              HisabYar_Pro_Offline_v1.5.9_OCR_Fixed.zip \
              HisabYar_Pro_Offline_v1.5.9.zip \
              HisabYar_Pro_Offline_v1.5.8.zip; do
              if [[ -f "$candidate" ]]; then ZIP_FILE="$candidate"; break; fi
            done
            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*HisabYar*Offline*.zip' -print -quit)"
            fi
            if [[ -z "$ZIP_FILE" || ! -f "$ZIP_FILE" ]]; then
              echo 'Project source not found: app/build.gradle is missing and no HisabYar offline ZIP was found.'
              echo 'Upload the complete project ZIP to the repository root.'
              exit 1
            fi
            mkdir -p /tmp/hisabyar-source
            unzip -q "$ZIP_FILE" -d /tmp/hisabyar-source
            PROJECT_ROOT="$(find /tmp/hisabyar-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
            if [[ -z "$PROJECT_ROOT" ]]; then
              echo 'The ZIP does not contain app/build.gradle.'; exit 1
            fi
            cp -a "$PROJECT_ROOT"/. .
          fi
          test -f app/build.gradle
          test -f app/src/main/java/com/example/hisabyar/MainActivity.java
          echo 'Project source prepared at repository root.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Download and bundle Persian OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/fas.traineddata" \
            -o app/src/main/assets/tessdata/fas.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/fas.traineddata)" -gt 100000
          echo "Persian OCR model size: $(du -h app/src/main/assets/tessdata/fas.traineddata | cut -f1)"

      - name: Validate source and offline OCR
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '1.5.9-Pro'" app/build.gradle
          grep -q "com.rmtheis:tess-two:9.1.0" app/build.gradle
          grep -q 'TessBaseAPI' app/src/main/java/com/example/hisabyar/MainActivity.java
          grep -q 'fas.traineddata' app/src/main/java/com/example/hisabyar/MainActivity.java
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo 'App must not request Internet permission.'; exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK and bundled OCR model
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/tessdata/fas.traineddata'
          unzip -p "$APK" assets/tessdata/fas.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.5.9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
