name: Build hesabyar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # آماده‌سازی Android SDK بدون نصب پکیج قدیمی tools
      - name: Prepare Android SDK
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # نصب Gradle
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # پیدا کردن و استخراج فایل ZIP سورس
      - name: Extract source ZIP
        run: |
          set -e

          ZIP_FILE="hesabyar_Pro_Offline_v1.9.3_GitHubReady.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source ZIP extracted successfully."

      # پیدا کردن مسیر واقعی پروژه اندروید
      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/app/build.gradle" ] || \
               [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo "Extracted file list:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      # بررسی ساختار پروژه
      - name: Verify project files
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app/src/main" ]; then
            echo "ERROR: app/src/main folder was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "WARNING: Gradle wrapper was not found."
            echo "Gradle installed on GitHub Actions will be used."
          fi

          echo "Project structure verified."

      # ساخت APK
      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      # پیدا کردن و آماده‌سازی APK
      - name: Prepare APK
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" output/hesabyar.apk

          echo "APK successfully prepared."

      # بارگذاری APK برای دانلود
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-Pro-Offline-APK
          path: output/hesabyar.apk
          if-no-files-found: error
          retention-days: 14
