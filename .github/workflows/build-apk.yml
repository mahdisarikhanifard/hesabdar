name: Build HisabYar Pro Offline v1.6.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail
          # Always prefer the supplied complete project ZIP. The repository may
          # already contain an older app/ folder, which must not silently win.
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*HisabYar*Offline*.zip' -print -quit)"
          if [[ -n "$ZIP_FILE" ]]; then
            echo "Using complete project ZIP: $ZIP_FILE"
            rm -rf /tmp/hisabyar-source
            mkdir -p /tmp/hisabyar-source
            unzip -q "$ZIP_FILE" -d /tmp/hisabyar-source
            PROJECT_ROOT="$(find /tmp/hisabyar-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle$##')"
            if [[ -z "$PROJECT_ROOT" ]]; then echo '::error::ZIP does not contain app/build.gradle'; exit 1; fi
            # Replace stale project files with the complete project from the ZIP.
            cp -a "$PROJECT_ROOT"/. .
          elif [[ ! -f app/build.gradle ]]; then
            echo '::error::Project source missing. Upload the complete HisabYar offline ZIP to the repository root.'
            exit 1
          else
            echo 'No project ZIP found; using repository source.'
          fi
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          echo "Source version line: $(grep -n 'versionName' app/build.gradle | head -1)"
          echo 'Project source prepared.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Download and bundle Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip' \
            -o /tmp/vosk-fa.zip
          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa
          MODEL_DIR="$(find /tmp/vosk-fa -type f -path '*/am/final.mdl' -print -quit | sed 's#/am/final.mdl$##')"
          if [[ -z "$MODEL_DIR" ]]; then
            echo '::error::فایل اصلی مدل Vosk یعنی am/final.mdl در ZIP پیدا نشد.'
            find /tmp/vosk-fa -maxdepth 3 -type f | head -80
            exit 1
          fi
          # Some official model archives omit metadata files expected by
          # Vosk Android StorageService. Supply them when absent.
          mkdir -p "$MODEL_DIR/conf"
          if [[ ! -s "$MODEL_DIR/conf/model.conf" ]]; then
            cat > "$MODEL_DIR/conf/model.conf" <<'EOF'
          --beam=13.0
          --lattice-beam=6.0
          EOF
          fi
          if [[ ! -s "$MODEL_DIR/uuid" ]]; then
            printf '%s\n' 'hisabyar-vosk-fa-0.42-v1.6.0' > "$MODEL_DIR/uuid"
          fi
          test -s "$MODEL_DIR/am/final.mdl"
          test -s "$MODEL_DIR/conf/model.conf"
          test -s "$MODEL_DIR/uuid"
          rm -rf app/src/main/assets/model-fa
          cp -a "$MODEL_DIR" app/src/main/assets/model-fa
          test -s app/src/main/assets/model-fa/am/final.mdl
          test -s app/src/main/assets/model-fa/uuid
          test -s app/src/main/assets/model-fa/conf/model.conf
          echo "Vosk Persian model bundled: $(du -sh app/src/main/assets/model-fa | cut -f1)"

      - name: Download and bundle Persian and English OCR models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/fas.traineddata' \
            -o app/src/main/assets/tessdata/fas.traineddata
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://github.com/tesseract-ocr/tessdata_fast/raw/refs/heads/main/eng.traineddata' \
            -o app/src/main/assets/tessdata/eng.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/fas.traineddata)" -gt 100000
          test "$(stat -c%s app/src/main/assets/tessdata/eng.traineddata)" -gt 100000
          echo 'OCR models bundled:'
          du -h app/src/main/assets/tessdata/*.traineddata

      - name: Validate source, model files, and offline policy
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          echo 'Checking app source and version...'
          grep -q "versionName '1.6.0-Pro'" app/build.gradle || fail "app/build.gradle does not declare versionName 1.6.0-Pro"
          grep -q "com.rmtheis:tess-two:9.1.0" app/build.gradle || fail "Tesseract dependency com.rmtheis:tess-two:9.1.0 is missing"
          MAIN=app/src/main/java/com/example/hisabyar/MainActivity.java
          test -s "$MAIN" || fail "MainActivity.java not found at expected path: $MAIN"
          grep -q 'TessBaseAPI' "$MAIN" || fail 'MainActivity does not use TessBaseAPI'
          grep -q 'tessdata/fas.traineddata' "$MAIN" || fail 'MainActivity does not load the Persian OCR model'
          grep -q 'tessdata/eng.traineddata' "$MAIN" || fail 'MainActivity does not load the English OCR model'
          echo 'Checking downloaded Vosk assets...'
          for f in app/src/main/assets/model-fa/am/final.mdl app/src/main/assets/model-fa/uuid app/src/main/assets/model-fa/conf/model.conf; do
            if [[ ! -s "$f" ]]; then echo '::error::Missing or empty required Vosk asset:' "$f"; find app/src/main/assets/model-fa -maxdepth 4 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true; exit 1; fi
          done
          echo 'Checking downloaded OCR assets...'
          for f in app/src/main/assets/tessdata/fas.traineddata app/src/main/assets/tessdata/eng.traineddata; do
            if [[ ! -s "$f" ]]; then echo '::error::Missing or empty OCR model:' "$f"; find app/src/main/assets -maxdepth 4 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true; exit 1; fi
            size=$(stat -c%s "$f")
            if [[ "$size" -le 100000 ]]; then fail "OCR model is too small or invalid: $f ($size bytes)"; fi
          done
          echo 'Checking that app does not request Internet permission...'
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            fail 'App must not request Internet permission.'
          fi
          echo 'All source, model, and offline-policy checks passed.'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify models are embedded in APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F 'assets/model-fa/uuid'
          unzip -l "$APK" | grep -F 'assets/model-fa/conf/model.conf'
          unzip -l "$APK" | grep -F 'assets/tessdata/fas.traineddata'
          unzip -l "$APK" | grep -F 'assets/tessdata/eng.traineddata'
          unzip -p "$APK" assets/tessdata/fas.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'
          unzip -p "$APK" assets/tessdata/eng.traineddata | wc -c | awk '$1 > 100000 {ok=1} END {exit !ok}'
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.6.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
