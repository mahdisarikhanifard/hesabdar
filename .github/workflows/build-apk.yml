name: Build hesabyar Pro Offline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android source
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project files found."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify app identity and version
        shell: bash
        run: |
          set -euo pipefail

          grep -q "com.example.hesabyarpro" app/build.gradle
          grep -q "1.9.4" app/build.gradle

          echo "App identity and version checked."

      - name: Download Persian offline speech model
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets

          curl --fail --location --retry 3 \
            "https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip" \
            -o /tmp/vosk-fa.zip

          mkdir -p /tmp/vosk-fa
          unzip -q /tmp/vosk-fa.zip -d /tmp/vosk-fa

          MODEL_DIR="$(find /tmp/vosk-fa \
            -type f \
            -path '*/am/final.mdl' \
            -print -quit | sed 's#/am/final.mdl$##')"

          if [[ -z "$MODEL_DIR" ]]; then
            echo "::error::Persian Vosk model was not found."
            exit 1
          fi

          mkdir -p "$MODEL_DIR/conf"

          if [[ ! -s "$MODEL_DIR/conf/model.conf" ]]; then
            printf '%s\n' \
              '--beam=13.0' \
              '--lattice-beam=6.0' \
              > "$MODEL_DIR/conf/model.conf"
          fi

          if [[ ! -s "$MODEL_DIR/uuid" ]]; then
            printf '%s\n' \
              'hesabyar-vosk-fa-0.42' \
              > "$MODEL_DIR/uuid"
          fi

          rm -rf app/src/main/assets/model-fa
          cp -a "$MODEL_DIR" app/src/main/assets/model-fa

          test -s app/src/main/assets/model-fa/am/final.mdl

          echo "Persian speech model bundled."

      - name: Build APK
        shell: bash
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated."
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-Pro-Offline-v1.9.4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
