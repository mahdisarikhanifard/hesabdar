name: Build HisabYar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Extract source ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="HisabYar_Completed_Source_v0.2.0.zip"

          if [ ! -s "$GITHUB_WORKSPACE/$ZIP_FILE" ]; then
            echo "::error::فایل $ZIP_FILE در ریشه مخزن پیدا نشد."
            echo "فایل‌های ZIP موجود در مخزن:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted_source"

          unzip -q \
            "$GITHUB_WORKSPACE/$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_source"

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/extracted_source" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::فایل settings.gradle یا settings.gradle.kts داخل ZIP پیدا نشد."
            echo "محتویات استخراج‌شده:"
            find "$GITHUB_WORKSPACE/extracted_source" \
              -maxdepth 4 -type f -print || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Validate source files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -s settings.gradle -o -s settings.gradle.kts
          test -s build.gradle -o -s build.gradle.kts
          test -s app/src/main/AndroidManifest.xml

          if [ ! -s app/build.gradle ] && [ ! -s app/build.gradle.kts ]; then
            echo "::error::فایل build.gradle یا build.gradle.kts در پوشه app پیدا نشد."
            exit 1
          fi

          if [ ! -d app/src/main ]; then
            echo "::error::پوشه app/src/main پیدا نشد."
            exit 1
          fi

          echo "ساختار اصلی پروژه بررسی شد."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_FILE" ]; then
            echo "::error::فایل APK ساخته نشد."
            exit 1
          fi

          echo "APK ساخته شد:"
          ls -lh "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
