name: Inspect Hesabyar Source ZIP

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "===== Repository root ====="
          ls -la

          echo "===== ZIP source files ====="
          find . -maxdepth 5 -type f -iname "*.zip"

      - name: Inspect v1.9.4 source ZIP
        run: |
          ZIP="./hesabyar_Pro_Offline_v1.9.4_BankAmountFix_Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          echo "===== Complete ZIP file listing ====="
          unzip -l "$ZIP"

      - name: Search Android project files in repository
        run: |
          echo "===== Gradle and Android project files ====="

          find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" -o \
            -name "AndroidManifest.xml" \
          \) -not -path "./.git/*" -print
