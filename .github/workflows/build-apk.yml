name: Build hesabyar APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \
            -iname "hesabyar_Pro_Offline_v1.9.3_GitHubReady.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found."
            echo "Expected:"
            echo "hesabyar_Pro_Offline_v1.9.3_GitHubReady.zip"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings file was not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app/src/main" ]; then
            echo "ERROR: app/src/main folder was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper was not found."
            exit 1
          fi

          echo "Project structure verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      - name: Find and prepare APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p output

          cp "$APK_FILE" \
            "output/hesabyar-Pro-Offline-v1.9.3.apk"

          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hesabyar-Pro-Offline-v1.9.3-APK
          path: output/hesabyar-Pro-Offline-v1.9.3.apk
          if-no-files-found: error
          retention-days: 14
