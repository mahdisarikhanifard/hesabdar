      - name: Prepare exact version 1.6.0 source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./HisabYar_Pro_Offline_v1.6.0_Voice_OCR_Fixed.zip"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using exact ZIP: $ZIP_FILE"

          rm -rf /tmp/hisabyar-source
          mkdir -p /tmp/hisabyar-source

          unzip -q "$ZIP_FILE" -d /tmp/hisabyar-source

          echo "ZIP directory structure:"
          find /tmp/hisabyar-source -maxdepth 4 -type f \
            \( -name 'build.gradle' \
            -o -name 'build.gradle.kts' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'gradlew' \
            -o -name 'gradle-wrapper.properties' \
            -o -name 'AndroidManifest.xml' \) -print | sort

          mapfile -t GRADLE_FILES < <(
            find /tmp/hisabyar-source \
              -type f \
              -path '*/app/build.gradle' \
              -print
          )

          if [[ "${#GRADLE_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one app/build.gradle file."
            printf '%s\n' "${GRADLE_FILES[@]}"
            exit 1
          fi

          GRADLE_FILE="${GRADLE_FILES[0]}"
          PROJECT_ROOT="${GRADLE_FILE%/app/build.gradle}"

          echo "Detected project root: $PROJECT_ROOT"
          echo "Detected version:"
          grep -n 'versionName' "$GRADLE_FILE"

          if ! grep -Eq "versionName[[:space:]]+['\"]1\.6\.0-Pro['\"]" "$GRADLE_FILE"; then
            echo "::error::Incorrect project version."
            exit 1
          fi

          if ! grep -Fq "com.rmtheis:tess-two:9.1.0" "$GRADLE_FILE"; then
            echo "::error::Expected tess-two:9.1.0 dependency not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" ]]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/settings.gradle" && ! -f "$PROJECT_ROOT/settings.gradle.kts" ]]; then
            echo "::error::Gradle settings file not found in project root."
            exit 1
          fi

          if [[ ! -f "$PROJECT_ROOT/gradlew" ]]; then
            echo "::error::The ZIP does not contain gradlew in the detected project root."
            echo "Checking whether a wrapper exists elsewhere in the ZIP..."
            find /tmp/hisabyar-source -type f \
              \( -name 'gradlew' -o -name 'gradle-wrapper.jar' \) -print
            echo "::error::The workflow cannot safely assume a Gradle wrapper exists. The ZIP structure must be checked."
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$PROJECT_ROOT"/. .

          chmod +x gradlew

          echo "Final project version:"
          grep -n 'versionName' app/build.gradle

          echo "Project source prepared successfully."
