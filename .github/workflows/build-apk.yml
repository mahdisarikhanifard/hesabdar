name: Build HisabYar Pro Offline v1.7.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'build-apk.yml'
      - '.github/workflows/**'
      - '*.zip'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # مرحله ۱: دریافت فایل‌های مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # مرحله ۲: آماده‌سازی سورس برنامه
      - name: Prepare project source
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f app/build.gradle ]]; then

            ZIP_FILE="./HisabYar_Pro_Offline_v1.7.5_BankImport.zip"

            if [[ ! -s "$ZIP_FILE" ]]; then
              echo "::error::Source ZIP not found."
              echo "ZIP files in repository root:"
              find . -maxdepth 1 -type f -iname '*.zip' -print
              exit 1
            fi

            echo "Source archive: $ZIP_FILE"

            rm -rf /tmp/hesabyar-source
            mkdir -p /tmp/hesabyar-source

            unzip -q "$ZIP_FILE" -d /tmp/hesabyar-source

            PROJECT_ROOT="$(
              find /tmp/hesabyar-source \
                -type f \
                -path '*/app/build.gradle' \
                -print -quit |
                sed 's#/app/build.gradle$##'
            )"

            if [[ -z "$PROJECT_ROOT" ]]; then
              echo "::error::app/build.gradle not found inside ZIP."
              exit 1
            fi

            cp -a "$PROJECT_ROOT"/. .
          fi

          test -s app/build.gradle
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/example/hisabyar/MainActivity.java

          echo "Project source prepared."

      # مرحله ۳: نصب Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # مرحله ۴: نصب Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # مرحله ۵: نصب Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # مرحله ۶: نصب پلتفرم‌ها و ابزارهای SDK
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # مرحله ۷: بررسی نسخه برنامه
      - name: Verify application version
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking app/build.gradle"

          grep -nE \
            'versionCode|versionName|compileSdk|targetSdk|minSdk' \
            app/build.gradle || true

          if ! grep -qE 'versionCode[[:space:]]+175([[:space:]]|$)' \
            app/build.gradle; then
            echo "::error::Expected versionCode 175."
            exit 1
          fi

          if ! grep -qF "versionName '1.7.5-Pro'" \
            app/build.gradle; then
            echo "::error::Expected versionName 1.7.5-Pro."
            exit 1
          fi

          echo "Application version verified."

      # مرحله ۸: ساخت APK
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # مرحله ۹: بررسی فایل خروجی
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::APK file was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK_PATH"

      # مرحله ۱۰: انتشار فایل APK برای دانلود
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabYar-Pro-Offline-v1.7.5-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
