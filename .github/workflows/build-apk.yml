      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f gradlew.bat ]; then
            echo "Windows Gradle wrapper found, but Linux wrapper is missing."
            exit 1
          else
            echo "Gradle wrapper not found. Checking for system Gradle..."

            if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
              gradle assembleDebug --no-daemon
            else
              echo "ERROR: Gradle project files not found."
              exit 1
            fi
          fi
